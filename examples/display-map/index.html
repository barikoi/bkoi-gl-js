<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../dist/iife/bkoi-gl.css" />
  <script src="../../dist/iife/bkoi-gl.js"></script>
  <style>
    body,
    #map {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
  </style>
  <title>Display Map</title>
</head>

<body>
  <div id="map"></div>

  <script>
    bkoigl.accessToken = "YOUR_BARIKOI_API_KEY_HERE";
    const map = new bkoigl.Map({
      container: "map",
      center: [90.3938010872331, 23.821600277500405],
      zoom: 12,
      polygon: true, // Enable Polygon Drawing
      drawOptions: {
        controls: {
          polygon: true,
          trash: true
        }
      }
    });

    map.addControl(new bkoigl.FullscreenControl(), "top-right");
    map.addControl(new bkoigl.NavigationControl(), "top-right");
    map.addControl(new bkoigl.GeolocateControl(), "top-right");
    map.addControl(new bkoigl.ScaleControl(), "bottom-right");

    map.on('draw.create', (e) => {
      console.log('Polygon created:', e.features);
    });

    map.on('draw.update', (e) => {
      console.log('Polygon updated:', e.features);
    });

    map.on('draw.delete', (e) => {
      console.log('Polygon deleted:', e.features);
    });    
  </script>
</body>

</html>
