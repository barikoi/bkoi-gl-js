name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: extract_notes
        run: |
          # Extract the release notes for the current version
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # Find the section for this version in CHANGELOG.md
          # Get everything between "## [${VERSION}]" and the next "## [" or "---"
          sed -n "/## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '/^## \[/d' | sed '/^---$/d' > release_notes.md

          # If file is empty, use a default message
          if [ ! -s release_notes.md ]; then
            echo "Release version ${VERSION}" > release_notes.md
          fi

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: bkoi-gl v${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.extract_notes.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-') }}
          generate_release_notes: false
          files: |
            dist/index.js
            dist/index.cjs
            dist/index.d.ts
            dist/index.d.cts
            dist/style/bkoi-gl.css
            dist/iife/bkoi-gl.js
            dist/umd/bkoi-gl.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

