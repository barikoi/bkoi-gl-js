# LLM code review on every push, via barikoi/code-review (see its README).
# Reviews each push and files issues for findings; narrow `branches` to
# limit noise. Pinned to a full commit SHA of the v1 tag — a floating tag
# would let whoever can move it run arbitrary code on the self-hosted
# runner; bump the SHA deliberately when upgrading.
name: Code Review

on:
  push:
    branches: ["dev", "main"]

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  review:
    uses: barikoi/code-review/.github/workflows/ollama-code-review.yml@bacc19e24cf67070a58b854214cbe7000defb46d # v1
    with:
      runs_on: self-hosted
    secrets:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
